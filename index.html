<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohammed Arif</title>
<style>
  :root { --bg:#0B1630; --text:#96AAC8; --green:#3DDC97; --gold:#F5B942; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:"Fira Code",ui-monospace,Consolas,monospace;
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:40px 12px; }
  h1 { margin:0; font-size:1.15rem; font-weight:600; color:var(--gold); }
  .frame { max-width:100%; border:1px solid #1D2B4A; border-radius:14px; padding:14px; overflow:hidden; }
  canvas { display:block; cursor:crosshair; --x:50%; --y:50%;
    -webkit-mask-image:radial-gradient(circle 190px at var(--x) var(--y),#000 0%,rgba(0,0,0,.4) 100%);
            mask-image:radial-gradient(circle 190px at var(--x) var(--y),#000 0%,rgba(0,0,0,.4) 100%); }
  @media (hover:none) { canvas { -webkit-mask-image:none; mask-image:none; } }
  p { margin:0; font-size:.78rem; }
  a { color:var(--green); text-decoration:none; } a:hover { text-decoration:underline; }
</style>
</head>
<body>
  <h1>$ ./ride.sh</h1>
  <div class="frame"><canvas id="cv"></canvas></div>
  <p>move your cursor over the portrait &nbsp;·&nbsp; <a href="https://github.com/Arifcodes11">back to profile</a></p>

          flick=dw*0.18;
        }
      }
      const i=idx(sx,sy);
      let ch=CH[i];
      if(flick&&Math.random()<flick){
        const k=clamp(RAMP.indexOf(ch)+(Math.random()<0.5?-1:1),0,RAMP.length-1); ch=RAMP[k];
      }
      const col=COLORS[i];
      if(col!==last){ctx.fillStyle=col; last=col;}
      let px=x*cw, py=y*chh;
      if(x>=44&&y<56&&!wh){ py+=bob; if(y>=3&&y<=38&&x>=55) px+=sway; }   // bike & rider bounce
      else if(wh){ py+=bob; }
      ctx.fillText(ch,px,py);
    }
  }
  // particles
  if(parts.length<90) for(let k=0;k<2;k++) spawn();
  for(let k=parts.length-1;k>=0;k--){
    const p=parts[k]; p.life+=dt; p.vy+=16*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.life>p.max||p.x<0||p.y>ROWS){parts.splice(k,1);continue;}
    ctx.globalAlpha=1-p.life/p.max; ctx.fillStyle="#e0a060";
    ctx.fillText(p.c,p.x*cw,p.y*chh);
  }
  ctx.globalAlpha=1;
}

const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let prev=0,tAcc=0;
function loop(now){
  const dt=Math.min(0.05,(now-prev)/1000);
  if(dt>=1/32||!prev){ tAcc+=dt||0; frame(tAcc,dt||0.03); prev=now; }
  requestAnimationFrame(loop);
}
if(still) frame(0,0.03); else requestAnimationFrame(loop);

cv.addEventListener("mousemove",e=>{const r=cv.getBoundingClientRect();
  cv.style.setProperty("--x",(e.clientX-r.left)+"px"); cv.style.setProperty("--y",(e.clientY-r.top)+"px");});
</script>
